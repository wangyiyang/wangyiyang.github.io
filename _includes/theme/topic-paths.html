<section class="theme-section">
  <div class="theme-container">
    <header class="theme-section-header">
      <div class="theme-section-kicker">Topics</div>
      <h2 class="theme-section-title">文章分类</h2>
      <p class="theme-section-description">按主题组织的阅读路径。</p>
    </header>
    <div class="theme-grid theme-grid-3">
      {% for topic in site.data.topics %}
      {% assign topic_posts = site.categories[topic.category] | default: empty %}
      <article class="console-panel topic-path" id="{{ topic.key }}">
        <div class="console-panel-head">
          <span>{{ topic.category }}</span>
          <span>{{ topic_posts.size }} 篇</span>
        </div>
        <div class="console-panel-body">
          <h3 class="topic-path-title"><a href="{{ topic.url | relative_url }}">{{ topic.title }}</a></h3>
          <p class="topic-path-desc">{{ topic.description }}</p>
        </div>
      </article>
      {% endfor %}
    </div>
  </div>
</section>
